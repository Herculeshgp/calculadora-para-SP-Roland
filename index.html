<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora Roland</title>
    <style>
      * { box-sizing: border-box; }
      body {
        background-color: #F1F1F1;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 16px;
      }
      h2 { color: red; font-size: 1.3em; margin: 8px 0 0; }
      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }
      @media (min-width: 768px) {
        .row { grid-template-columns: 1fr 1fr; gap: 30px; }
      }
      .calculator-container {
        width: 100%;
        background-color: #ffffff;
        margin-top: 20px;
        padding: 24px 20px;
        border-radius: 20px;
        box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.3);
        text-align: center;
      }
      h1 {
        font-size: 1.6em;
        margin: 0;
        color: #333333;
      }
      form {
        margin-top: 24px;
        text-align: left;
      }
      .form-group { margin-bottom: 4px; }
      label {
        display: block;
        font-size: 1.1em;
        color: #333333;
        margin-bottom: 6px;
      }
      input[type="number"] {
        padding: 14px 10px;
        font-size: 1.2em;
        border-radius: 5px;
        border: 1px solid #cccccc;
        margin-bottom: 14px;
        width: 100%;
      }
      input[type="button"], .btn {
        background-color: #4CAF50;
        color: white;
        font-size: 1.1em;
        padding: 14px 20px;
        margin-top: 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
      }
      .btn-primary { background-color: #007bff; }
      .text-center { text-align: center; }
      #resultAdesivo {
        font-size: 1.4em;
        color: #4CAF50;
        margin-top: 20px;
      }
      .result {
        font-size: 1.4em;
        color: #4CAF50;
        margin-top: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="calculator-container">
          <h1>Adesivos Roland em 1M²</h1>
          <h2>Acrescentar 0,2cm</h2>
          <form>
            <div class="form-group">
              <label for="heightAdesivo">Altura do Adesivo (cm):</label>
              <input type="number" inputmode="decimal" id="heightAdesivo" name="heightAdesivo" required>
            </div>
            <div class="form-group">
              <label for="widthAdesivo">Largura do Adesivo (cm):</label>
              <input type="number" inputmode="decimal" id="widthAdesivo" name="widthAdesivo" required>
            </div>
            <div class="text-center">
              <button class="btn btn-primary" onclick="calculateAdesivo(event)">Calcular</button>
            </div>
          </form>
          <p id="resultAdesivo"></p>
        </div>

        <div class="calculator-container">
          <h1>Adesivos Roland</h1>
          <h2>Acrescentar 0,4 cm</h2>
          <form>
            <label for="comprimento">Largura (cm):</label>
            <input type="number" inputmode="decimal" id="comprimento">
            <label for="altura">Altura (cm):</label>
            <input type="number" inputmode="decimal" id="altura">
            <label for="quantidade">Quantidade:</label>
            <input type="number" inputmode="numeric" id="quantidade">
            <input type="button" value="Calcular" onclick="calcularArea()">
          </form>
          <div class="result">
            <p>Área Total: <span id="resultado"></span> metros quadrados</p>
          </div>
        </div>
      </div>
    </div>
<script>
function calculateAdesivo(e) {
e.preventDefault()
var height = document.getElementById("heightAdesivo").value;
var width = document.getElementById("widthAdesivo").value;
var resultAdesivo = Math.floor(100/height) * Math.floor(100/width);
document.getElementById("resultAdesivo").innerHTML = "Cabem : " + resultAdesivo + " adesivos em 1M²";
}
function calcularArea() {
var comprimento = document.getElementById("comprimento").value;
var altura = document.getElementById("altura").value;
var quantidade = document.getElementById("quantidade").value;
var area = (comprimento * altura) * quantidade;
var extra = 0 * quantidade;
var total = area/10000 + extra;
document.getElementById("resultado").innerHTML = total.toFixed(2);
}
</script>
  </body>
</html>
